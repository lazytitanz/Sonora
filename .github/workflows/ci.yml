name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows build, test, pack
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Sonora.slnx

      - name: Build Release
        run: dotnet build Sonora.slnx -c Release --no-restore

      - name: Test (exclude Hardware)
        run: dotnet test Sonora.slnx -c Release --no-build --filter "Category!=Hardware" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Pack
        run: |
          dotnet pack src/Sonora.Audio/Sonora.Audio.csproj -c Release --no-build -o artifacts
          dotnet pack src/Sonora.Audio.Windows/Sonora.Audio.Windows.csproj -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  linux-core:
    name: Linux core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore core
        run: |
          dotnet restore src/Sonora.Audio/Sonora.Audio.csproj
          dotnet restore tests/Sonora.Audio.Tests/Sonora.Audio.Tests.csproj

      - name: Build core
        run: |
          dotnet build src/Sonora.Audio/Sonora.Audio.csproj -c Release --no-restore
          dotnet build tests/Sonora.Audio.Tests/Sonora.Audio.Tests.csproj -c Release --no-restore

      - name: Test core
        run: dotnet test tests/Sonora.Audio.Tests/Sonora.Audio.Tests.csproj -c Release --no-build
