name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SONORA_PACKAGE_VERSION: 1.0.0-rc.1

jobs:
  windows:
    name: Windows build, test, pack
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Prepare Vetra local NuGet packages
        run: ./scripts/pack-vetra.ps1
        shell: pwsh

      - name: Restore
        run: dotnet restore Sonora.slnx

      - name: Vulnerability check
        run: |
          dotnet list Sonora.slnx package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
        continue-on-error: false

      - name: Build Release
        run: dotnet build Sonora.slnx -c Release --no-restore

      - name: Test (exclude Hardware and Soak)
        timeout-minutes: 15
        run: dotnet test Sonora.slnx -c Release --no-build --filter "Category!=Hardware&Category!=Soak" --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal" --blame-hang-timeout 3m

      - name: Pack
        run: |
          dotnet pack src/Sonora.Audio/Sonora.Audio.csproj -c Release --no-build -o artifacts
          dotnet pack src/Sonora.Audio.Windows/Sonora.Audio.Windows.csproj -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Package consumer smoke
        run: |
          # nuget.config points at ../../artifacts (populated by Pack above).
          dotnet restore tests/Sonora.PackageConsumer/Sonora.PackageConsumer.csproj --force
          dotnet test tests/Sonora.PackageConsumer/Sonora.PackageConsumer.csproj -c Release --no-restore --logger "console;verbosity=normal"

  linux-core:
    name: Linux core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore core
        run: |
          dotnet restore src/Sonora.Audio/Sonora.Audio.csproj
          dotnet restore tests/Sonora.Audio.Tests/Sonora.Audio.Tests.csproj

      - name: Vulnerability check (core)
        run: |
          dotnet list src/Sonora.Audio/Sonora.Audio.csproj package --vulnerable --include-transitive
          dotnet list tests/Sonora.Audio.Tests/Sonora.Audio.Tests.csproj package --vulnerable --include-transitive

      - name: Build core
        run: |
          dotnet build src/Sonora.Audio/Sonora.Audio.csproj -c Release --no-restore
          dotnet build tests/Sonora.Audio.Tests/Sonora.Audio.Tests.csproj -c Release --no-restore

      - name: Test core (exclude Soak)
        timeout-minutes: 15
        run: dotnet test tests/Sonora.Audio.Tests/Sonora.Audio.Tests.csproj -c Release --no-build --filter "Category!=Soak" --blame-hang-timeout 3m

      - name: Pack core
        run: dotnet pack src/Sonora.Audio/Sonora.Audio.csproj -c Release --no-build -o artifacts

      - name: Package consumer smoke (Sonora.Audio only)
        run: |
          # Linux cannot restore Sonora.Audio.Windows (Windows TFM). Core package only.
          dotnet restore tests/Sonora.PackageConsumer/Sonora.PackageConsumer.csproj -p:SonoraPackageConsumerWindows=false --force
          dotnet test tests/Sonora.PackageConsumer/Sonora.PackageConsumer.csproj -c Release --no-restore -p:SonoraPackageConsumerWindows=false --filter "Category!=WindowsPackage"
